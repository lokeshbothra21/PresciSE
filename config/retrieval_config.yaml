# NOTE: this file documents the retrieval defaults. They currently live in code
# (HybridRetriever defaults + core/retrieval/search_router.py); this YAML is not
# yet loaded at runtime. Keep it in sync if/when config loading is wired up.

lexical:
  enabled: true
  top_k: 15
  weight: 0.6

semantic:
  enabled: true
  top_k: 15
  embedding_model: "allenai/specter"
  weight: 0.4

router:
  # The query router is a rule-based engine (core/retrieval/search_router.py).
  # It is NOT an LLM — the earlier Qwen2.5 model was removed.
  enabled: true
  type: "rule-based"
  fallback_bm25_weight: 0.6
  fallback_faiss_weight: 0.4

formula:
  enabled: true
  top_k: 10
  weight: 0.5
  similarity_threshold: 0.15

reranking:
  enabled: false
  top_k: 5
